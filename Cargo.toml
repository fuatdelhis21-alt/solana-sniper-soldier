[workspace]
resolver = "2"
members = [
    "crates/*",
    "solana-sniper",
    "tools/hsm_server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Solana HFT Platform Team"]
repository = "https://github.com/example/solana-hft-platform"
description = "Ultra-low-latency, production-grade Solana trading platform"

[workspace.dependencies]
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "time"] }
tracing-appender = "0.2"
prometheus = "0.13"
parking_lot = "0.12"
arc-swap = "1.7"
crossbeam = "0.8"
once_cell = "1.19"
notify = "6.1"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
criterion = { version = "0.5", features = ["html_reports"] }
bincode = "1"
chrono = "0.4"
hex = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
byteorder = "1.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
base64 = "0.22"

# Solana deps
solana-sdk = "2.2"
solana-client = "2.2"
solana-program = "2.2"
solana-account-decoder = "2.2"
solana-transaction = "2.2"
solana-rpc-client = "2.2"
solana-rpc-client-api = "2.2"
solana-signature = "2.2"
solana-pubkey = "2.2"
solana-commitment-config = "2.2"
solana-compute-budget-interface = "2.2"
solana-transaction-status = "2.2"
spl-associated-token-account = "7.0"
spl-token = "8.0"

hft-core = { path = "crates/hft-core" }
hft-marketdata = { path = "crates/hft-marketdata" }
hft-execution = { path = "crates/hft-execution" }
