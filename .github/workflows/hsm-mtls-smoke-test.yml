name: HSM Security & mTLS Smoke Test

on: [push, pull_request]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Test Certs (before build - needed for tests)
        shell: pwsh
        run: |
          cd tools/hsm_server/certs
          ./generate_certs.ps1

      - name: Build All Binaries
        run: cargo build --all-targets

      - name: Run HSM Server (Background)
        run: |
          nohup ./target/debug/hsm_server --certs tools/hsm_server/certs --log-file hsm_audit.log > hsm_server.log 2>&1 &

      - name: Wait for HSM Server + Verify mTLS Enabled
        run: |
          for i in $(seq 1 30); do
            if grep -q "mTLS enabled" hsm_server.log 2>/dev/null; then
              echo "OK: HSM server started with mTLS enabled."
              break
            fi
            sleep 1
          done
          grep "mTLS enabled" hsm_server.log

      - name: Verify mTLS Enforced (no client cert rejected)
        run: |
          # A request WITHOUT a client cert MUST be rejected (non-zero exit).
          if curl -k -s --max-time 5 https://127.0.0.1:8443/sign --data "{}"; then
            echo "ERROR: server accepted a request WITHOUT client cert! mTLS not enforced."
            exit 1
          else
            echo "OK: server rejects unauthenticated handshake (mTLS enforced)."
          fi

      - name: Verify mTLS Signature (Positive Test)
        run: |
          # Deterministic offline dry-run: --blockhash avoids any RPC dependency.
          ./target/debug/solana-sniper --dry-run \
            --hsm-endpoint https://127.0.0.1:8443 \
            --hsm-ca tools/hsm_server/certs/ca.pem \
            --hsm-client-identity tools/hsm_server/certs/client_all.pem \
            --blockhash 11111111111111111111111111111111 \
            --iterations 1

      - name: Verify Unauthorized Access Rejected (Negative Test)
        run: |
          # Sertifikasiz istek hata vermeli (exit code non-zero)
          # `! curl` PASSES only when curl fails (rejected) and FAILS when curl succeeds.
          ! curl -k --fail https://127.0.0.1:8443/sign --data "invalid_payload"

      - name: Check Audit Logs
        run: |
          # Each signing request must be a structured JSON line with the required fields.
          grep "request_id" hsm_audit.log
          grep "tx_hash" hsm_audit.log
          grep "status" hsm_audit.log
          grep "timestamp" hsm_audit.log
          # Verify at least one request was signed (status="signed").
          grep '"status":"signed"' hsm_audit.log

      - name: Cleanup HSM Server
        if: always()
        run: |
          pkill -f hsm_server || true
