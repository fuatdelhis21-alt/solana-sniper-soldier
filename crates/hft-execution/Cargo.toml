[package]
name = "hft-execution"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
base64 = "0.22"

[features]
live = []
