---
# Deploy a release artifact built by scripts/build_and_publish.sh.
#   ARTIFACT_PATH=./solana-hft-release-*.tar.gz \
#   BOT_ENV_FILE=./prod/solana-hft.env \        # optional, kept on host if unset
#   ansible-playbook -i inventory.ini ansible/deploy.yml
- name: Deploy Solana HFT Platform
  hosts: hft_nodes
  become: yes
  vars:
    artifact_path: "{{ lookup('env', 'ARTIFACT_PATH') }}"
    bot_env_file: "{{ lookup('env', 'BOT_ENV_FILE') }}"
    staging_dir: /tmp/solana-hft-deploy

  tasks:
    - name: Require an artifact
      assert:
        that: artifact_path | length > 0
        fail_msg: "set ARTIFACT_PATH to a solana-hft-release-*.tar.gz"

    - name: Staging directory
      file:
        path: "{{ staging_dir }}"
        state: directory
        mode: "0700"

    - name: Upload artifact (from the control node)
      copy:
        src: "{{ artifact_path }}"
        dest: "{{ staging_dir }}/release.tar.gz"
        mode: "0600"

    - name: Upload bot env file
      copy:
        src: "{{ bot_env_file }}"
        dest: "{{ staging_dir }}/solana-hft.env"
        mode: "0600"
      when: bot_env_file | length > 0

    - name: Extract installer
      unarchive:
        src: "{{ staging_dir }}/release.tar.gz"
        dest: "{{ staging_dir }}"
        remote_src: yes
        include: [install_release.sh]

    - name: Install release
      command: >-
        /bin/bash {{ staging_dir }}/install_release.sh {{ staging_dir }}/release.tar.gz
        {{ (staging_dir ~ '/solana-hft.env') if bot_env_file | length > 0 else '' }}
      register: install_out

    - name: Installer output
      debug:
        var: install_out.stdout_lines

    - name: Remove staging directory (contains secrets)
      file:
        path: "{{ staging_dir }}"
        state: absent
