[package]
name = "tools-hsm-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Remote HSM signer server scaffold for Solana HFT platform"

[dependencies]
warp = { version = "0.3", features = ["tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bincode = "1"
solana-sdk = "2.2"

[[bin]]
name = "hsm_server"
path = "main.rs"

