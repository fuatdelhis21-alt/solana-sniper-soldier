# Solana HFT — Prometheus alert rules (VPS)
#
# Secret'sız alert/label'lar. Bu dosya VPS üzerindeki Prometheus'a
# rules dosyası olarak yüklenir (örn. /etc/prometheus/rules/solana-hft.yml).
# Scrape hedefleri (yalnızca localhost, internete açılmaz):
#   job="solana-sniper" → bot  /metrics  (SNIPER_METRICS_ADDR, varsayılan 127.0.0.1:9090)
#   job="pool-sniper"   → supervisor /metrics (SNIPER_DISCOVERY_HEALTH_ADDR, 127.0.0.1:9091)
#
# Her ifade yalnızca kodun gerçekten yayınladığı metrik adlarını kullanır
# (solana-sniper/src/metrics.rs, solana-sniper/src/bin/pool_sniper.rs).

groups:
  - name: solana-hft-critical
    rules:
      # A live exit failed repeatedly: the position is still open and retried
      # every iteration (entry limits never block exits). Runbook §9.
      - alert: SolanaHftExitBlocked
        expr: exit_blocked == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "EXIT FAILING — live position still open"
          description: "consecutive_exit_failures >= 3. Bot keeps retrying; operator must check RPC/HSM/pool (docs/VPS_RUNBOOK.md §9)."

      - alert: SolanaHftExitFailures
        expr: consecutive_exit_failures >= 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Exit attempts failing"
          description: "At least one consecutive exit failure for 2 minutes."

      - alert: SolanaHftBreakerOpen
        expr: circuit_breaker_state == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker OPEN — no new entries (fail-closed)"
          description: "RPC/HSM/infra failures tripped the breaker."

      - alert: SolanaHftKillSwitchActive
        expr: hft_kill_switch_active == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kill switch active — no new entries"
          description: "Inspect the audit log for the trigger (unknown entry outcome, persist failure, ...). Exits continue."

      # Corrupt/unreadable risk_state.json at start, or a failed atomic write
      # since: new entries are refused.
      - alert: SolanaHftStateInvalid
        expr: state_verified == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Risk state unverifiable / not persisted — entries blocked"
          description: "risk_state.json could not be read or written durably."

      - alert: SolanaHftHsmErrors
        expr: increase(hft_hsm_errors[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "HSM signing errors detected"
          description: "hft_hsm_errors increased in the last 5 minutes."

      - alert: SolanaHftHsmSlow
        expr: histogram_quantile(0.95, sum(rate(hft_hsm_latency_ms_bucket[10m])) by (le)) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "HSM signing p95 above 1 s"
          description: "Signing latency degrades entry and exit timing."

      - alert: SolanaHftNotReady
        expr: ready == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "solana-sniper /ready is 503"
          description: "See the /ready JSON body for the failing condition."

      - alert: SolanaHftProcessDown
        expr: up{job="solana-sniper"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "solana-sniper metrics scrape failing"
          description: "Check systemctl status of the trading service."

  - name: pool-sniper
    rules:
      # Stream reconnect / queue overflow / unresolvable CreatePool: pools may
      # have been missed (no backfill exists). Also a failed state write.
      - alert: PoolSniperNotReady
        expr: pool_sniper_ready == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "pool-sniper discovery gap or state persist failure"
          description: "curl 127.0.0.1:9091/ready shows the reason."

      - alert: PoolSniperStreamSilent
        expr: pool_sniper_ws_last_message_age_ms > 180000 or pool_sniper_ws_last_message_age_ms == -1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No CLMM log stream messages"
          description: "WebSocket down or silent; no new pools are discovered."

      - alert: PoolSniperProcessDown
        expr: up{job="pool-sniper"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "pool-sniper metrics scrape failing"
          description: "Check systemctl status solana-hft-sniper."
